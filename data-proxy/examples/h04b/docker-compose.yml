name: data-nexus-h04b

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command:
      - start-dev
      - --import-realm
      - --hostname=https://idp.localhost:8443
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: smoke-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: smoke-admin-password
    volumes:
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/keycloak-data:/opt/keycloak/data
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/keycloak-tmp:/tmp

  gateway:
    image: rust:1.94-bookworm
    command: ["/usr/local/bin/proxy", "daemon", "-c", "/etc/data-nexus/gateway.toml"]
    environment:
      DATA_NEXUS_ADMIN_CORS_ORIGINS: https://ui.localhost:8443
    volumes:
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/cargo-target-linux/debug/proxy:/usr/local/bin/proxy:ro
      - ./gateway.toml:/etc/data-nexus/gateway.toml:ro
    depends_on:
      - keycloak

  gateway-wrong-issuer:
    image: rust:1.94-bookworm
    command: ["/usr/local/bin/proxy", "daemon", "-c", "/etc/data-nexus/gateway.toml"]
    environment:
      DATA_NEXUS_ADMIN_CORS_ORIGINS: https://ui.localhost:8443
    volumes:
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/cargo-target-linux/debug/proxy:/usr/local/bin/proxy:ro
      - ./gateway-wrong-issuer.toml:/etc/data-nexus/gateway.toml:ro
    depends_on:
      - keycloak

  data-ui:
    image: nginx:1.27-alpine
    volumes:
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/ui-work/.output/public:/usr/share/nginx/html:ro
      - ../../../data-ui/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${H04B_CACHE_DIR:?set H04B_CACHE_DIR}/certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
      - gateway
      - gateway-wrong-issuer
      - data-ui

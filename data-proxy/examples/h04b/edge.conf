map $host $h04b_upstream {
    idp.localhost keycloak:8080;
    ui.localhost data-ui:80;
    gateway.localhost gateway:8082;
    gateway-wrong-issuer.localhost gateway-wrong-issuer:8082;
    default data-ui:80;
}

server {
    listen 8443 ssl;
    server_name idp.localhost ui.localhost gateway.localhost gateway-wrong-issuer.localhost;

    resolver 127.0.0.11 valid=5s;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://$h04b_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

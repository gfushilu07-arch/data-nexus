# SQLT-2 security-off gateway used to compare frontend results with direct backends.
version = "2"

[admin]
host = "127.0.0.1"
port = 28082
log_level = "INFO"

[security]
enabled = false

[[listeners]]
name = "sqlt-mysql"
listen_addr = "127.0.0.1:29088"
protocol = "mysql"
service = "sqlt-mysql"
auth_policy = "sqlt-users"

[[listeners]]
name = "sqlt-postgres"
listen_addr = "127.0.0.1:29089"
protocol = "postgresql"
service = "sqlt-postgres"
auth_policy = "sqlt-users"

[[services]]
name = "sqlt-mysql"
backend_protocol = "mysql"
endpoints = ["sqlt-mysql-primary"]
route_policy = "sqlt-mysql-route"
plugin_policies = []

[[services]]
name = "sqlt-postgres"
backend_protocol = "postgresql"
endpoints = ["sqlt-postgres-primary"]
route_policy = "sqlt-postgres-route"
plugin_policies = []

[[endpoints]]
name = "sqlt-mysql-primary"
protocol = "mysql"
address = "127.0.0.1:23306"
database = "sqlt"
username = "sqlt"
password = "sqlt"
weight = 1

[[endpoints]]
name = "sqlt-postgres-primary"
protocol = "postgresql"
address = "127.0.0.1:25432"
database = "sqlt"
username = "sqlt"
password = "sqlt"
weight = 1

[[route_policies]]
name = "sqlt-mysql-route"
kind = "simple_load_balance"

[[route_policies]]
name = "sqlt-postgres-route"
kind = "simple_load_balance"

[[auth_policies]]
name = "sqlt-users"
kind = "static"
username = "root"
password = "root"
